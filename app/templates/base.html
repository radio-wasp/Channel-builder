<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ChannelBuilder{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#3b82f6',
              jellyfin: '#00a4dc',
              youtube: '#ff0000'
            }
          }
        }
      }
    </script>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">
    <!-- Navigation Bar -->
    <nav class="bg-slate-800/90 border-b border-slate-700/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="/" class="flex items-center gap-2 font-bold text-xl tracking-wide text-blue-400 hover:text-blue-300 transition">
                        <i class="fa-solid font-black fa-tv text-2xl text-blue-500"></i>
                        <span>ChannelBuilder</span>
                    </a>
                    <span class="px-2 py-0.5 text-xs font-semibold rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">v1.0</span>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 transition {% if active_page == 'dashboard' %}bg-slate-700 text-blue-400{% else %}text-slate-300{% endif %}">
                        <i class="fa-solid fa-gauge mr-1"></i> Dashboard
                    </a>
                    <a href="/channels" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 transition {% if active_page == 'channels' %}bg-slate-700 text-blue-400{% else %}text-slate-300{% endif %}">
                        <i class="fa-solid fa-layer-group mr-1"></i> Channels
                    </a>
                    <a href="/settings" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 transition {% if active_page == 'settings' %}bg-slate-700 text-blue-400{% else %}text-slate-300{% endif %}">
                        <i class="fa-solid fa-gear mr-1"></i> Settings
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800/40 border-t border-slate-800 py-6 text-center text-sm text-slate-400">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>ChannelBuilder — 24-Hour TV Channel Generator for Jellyfin & Dispatcharr</p>
            <div class="flex items-center gap-4 text-xs">
                <span>M3U: <code class="text-blue-400 font-mono">/playlist.m3u</code></span>
                <span>EPG: <code class="text-emerald-400 font-mono">/epg.xml</code></span>
            </div>
        </div>
    </footer>
</body>
</html>
